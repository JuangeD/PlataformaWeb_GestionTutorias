<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Proyecto</title>
    <link rel="stylesheet" href="css/styles.css">
    <!--Fuente para la pagina-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/script.js" defer></script>
</head>
<body>
    <!--Boton de volver atrás-->
    <header>
        <button id="imgFlecha"></button>
        <h1 id="tituloPrincipal">PLATAFORMA DE REGISTRO</h1>
    </header>



  
    <main id="main-principal">
        
        <!--Formulario completo para  Registrarse-->
        <section>
            <div>
            <h1>COMPLETE CORRECTAMENTE LOS DATOS</h1>
            </div>
            <div id="Formulario-Registro">

                <div>
                <label >Correo Electrónico</label>
                <input type="email" id="correo" placeholder="example@correo.com">
                </div>

                <div>
                <label >Repetir Correo</label>
                <input type="email" id="correo2" placeholder="Repita Correo">
                </div>

                <div>
                <label >Usuario</label>
                <input type="text" id="usuario" placeholder="Usuario">
                </div>

                <div>
                <label >Contraseña</label>
                <input id="contraseña" type="password" placeholder="Contraseña">
                </div>

                <div>
                <label>Repetir Contraseña</label>
                <input id="contraseña2" type="password" placeholder="Repita Contraseña">
                </div>

                <div>
                <label >DNI</label>
                <input id="DNI" type="text" placeholder="DNI / NIF">
                </div>
            
            </div>
            <button type="submit" id="btnRegister">Registrarse</button>
            <p id="mensajeRegistro"></p>
        </section>
           
       
    </main>

    <!--Pie de pagina-->
    <footer id="footer">
        <p><a id="inicio" href="../PaginaInicial/index.html">Inicio</a>            2026 Pagina Proyecto Web. Salvador - Juan Gerardo - Ángel.          <a id="ayudaContacto" href="../PagContacto/index.html">Contacto</a></p>
    </footer>

   
</body>
</html>
